<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="ORC-BALL">
  <!-- Dark navy tab background -->
  <rect width="32" height="32" rx="6" fill="#0a0a18"/>
  <!-- Orc ball body -->
  <circle cx="16" cy="16.5" r="12" fill="#2f9e2f"/>
  <circle cx="16" cy="16.5" r="12" fill="url(#shine)" opacity="0.35"/>
  <!-- Brows -->
  <path d="M7.5 11.5 L12.5 13.2" stroke="#145214" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M24.5 11.5 L19.5 13.2" stroke="#145214" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Eye sockets -->
  <ellipse cx="11.2" cy="14.2" rx="3.1" ry="2.6" fill="#0d1a0d"/>
  <ellipse cx="20.8" cy="14.2" rx="3.1" ry="2.6" fill="#0d1a0d"/>
  <!-- Red eyes -->
  <ellipse cx="11.4" cy="14.3" rx="1.7" ry="1.4" fill="#e01818"/>
  <ellipse cx="21" cy="14.3" rx="1.7" ry="1.4" fill="#e01818"/>
  <circle cx="12" cy="13.8" r="0.55" fill="#ff6b6b"/>
  <circle cx="21.6" cy="13.8" r="0.55" fill="#ff6b6b"/>
  <!-- Snout -->
  <ellipse cx="16" cy="17.6" rx="3.2" ry="2.2" fill="#248a24"/>
  <circle cx="14.6" cy="17.3" r="0.7" fill="#145214"/>
  <circle cx="17.4" cy="17.3" r="0.7" fill="#145214"/>
  <!-- Mouth line -->
  <path d="M10 20.2 Q16 23.2 22 20.2" fill="none" stroke="#145214" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Tusks -->
  <ellipse cx="10.2" cy="21.8" rx="1.7" ry="3.1" fill="#f2ece0"/>
  <ellipse cx="21.8" cy="21.8" rx="1.7" ry="3.1" fill="#f2ece0"/>
  <ellipse cx="10.2" cy="20.6" rx="0.9" ry="1.2" fill="#ffffff" opacity="0.55"/>
  <ellipse cx="21.8" cy="20.6" rx="0.9" ry="1.2" fill="#ffffff" opacity="0.55"/>
  <defs>
    <radialGradient id="shine" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#7dff7d"/>
      <stop offset="55%" stop-color="#2f9e2f" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a3a0a" stop-opacity="0.4"/>
    </radialGradient>
  </defs>
</svg>
